name: Verify application and Docker image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Build verified production image
        run: docker build -t boda-miller-daniela:test .
      - name: Test Docker startup and persistent volumes
        run: node tests/docker-smoke.mjs boda-miller-daniela:test
